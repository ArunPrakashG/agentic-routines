name: Release

# Publishes a GitHub release from a folder already committed under releases/.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v, e.g. 0.3.6
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          dir="releases/v${VERSION}"
          test -d "$dir"
          gh release create "v${VERSION}" --target "${GITHUB_SHA}" --title "v${VERSION}" \
            --notes-file "$dir/NOTES.md" "$dir"/extensions/*.zip "$dir"/cli/*.tgz "$dir/SHA256SUMS"
