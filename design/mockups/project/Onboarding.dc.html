<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First run: sign in, connect agent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Roboto:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-light{--bg:#F4F4F7;--surface-1:#FFFFFF;--surface-2:#EEEFF4;--surface-3:#E1E3EB;--border:#DFE1E8;--border-strong:#C6C9D4;--text-1:#14131F;--text-2:#4A4B5C;--text-3:#5E6072;--accent:#3530E0;--accent-ink:#3530E0;--on-accent:#FFFFFF;--accent-soft:rgba(53,48,224,.09);--warn:#8A5300;--warn-soft:rgba(190,120,0,.12);--warn-a:rgba(138,83,0,.35);--danger:#B4232A;--danger-soft:rgba(180,35,42,.09);--shadow-1:0 1px 2px rgba(20,19,31,.05);--shadow-2:0 16px 40px rgba(20,19,31,.12);--font-sans:'Schibsted Grotesk',system-ui,sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,monospace;--ease-out:cubic-bezier(.2,.8,.2,1);--ease-in-out:cubic-bezier(.65,0,.35,1);--ease-settle:cubic-bezier(.34,1.32,.64,1);--loop:14s}
.t-dark{--bg:#0E0D16;--surface-1:#15141F;--surface-2:#1C1B28;--surface-3:#272636;--border:#262535;--border-strong:#383749;--text-1:#ECEBF5;--text-2:#A9A8BD;--text-3:#86859C;--accent:#9D99FF;--accent-ink:#A5A1FF;--on-accent:#0E0D16;--accent-soft:rgba(157,153,255,.14);--warn:#F0B04A;--warn-soft:rgba(240,176,74,.12);--warn-a:rgba(240,176,74,.4);--danger:#FF7D74;--danger-soft:rgba(255,125,116,.12);--shadow-1:0 1px 0 rgba(255,255,255,.04) inset;--shadow-2:0 16px 40px rgba(0,0,0,.5);--font-sans:'Schibsted Grotesk',system-ui,sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,monospace;--ease-out:cubic-bezier(.2,.8,.2,1);--ease-in-out:cubic-bezier(.65,0,.35,1);--ease-settle:cubic-bezier(.34,1.32,.64,1);--loop:14s}
@supports not selector(::-webkit-scrollbar){.t-light *,.t-dark *{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}}
.t-light ::-webkit-scrollbar,.t-dark ::-webkit-scrollbar{width:10px;height:10px}
.t-light ::-webkit-scrollbar-track,.t-dark ::-webkit-scrollbar-track,.t-light ::-webkit-scrollbar-corner,.t-dark ::-webkit-scrollbar-corner{background:transparent}
.t-light ::-webkit-scrollbar-thumb,.t-dark ::-webkit-scrollbar-thumb{background:var(--border-strong);border:3px solid transparent;background-clip:content-box;border-radius:8px}
.t-light ::-webkit-scrollbar-thumb:hover,.t-dark ::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box}
.ob,.ob *{box-sizing:border-box}
.panel{width:400px;height:844px;display:flex;flex-direction:column;border-left:1px solid var(--border);border-right:1px solid var(--border)}
.btn{height:44px;padding:0 16px;border-radius:8px;font:500 14px/1 var(--font-sans);border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.icon-btn{width:44px;height:44px;border-radius:8px;border:0;background:transparent;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.gbtn{height:44px;padding:0 20px 0 14px;border-radius:22px;border:1px solid #747775;background:#FFFFFF;color:#1F1F1F;font:500 14px/1 'Roboto',sans-serif;display:inline-flex;align-items:center;gap:12px;cursor:pointer}
.agent{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:14px;border-top:1px solid var(--border)}
.agent:first-child{border-top:0}
.st{position:relative;width:110px;height:20px;font-size:12px}
.st > span{position:absolute;right:0;top:0;height:20px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pips{display:inline-flex;gap:3px}
.pips i{width:6px;height:6px;border-radius:2px;background:var(--surface-3)}
.scan i{animation:scan 1.2s var(--ease-in-out) infinite both}
.scan i:nth-child(2){animation-delay:.15s}.scan i:nth-child(3){animation-delay:.3s}
@keyframes scan{0%,100%{opacity:.35}30%{opacity:1}}
.w{animation:9s infinite both}.c{animation:9s var(--ease-settle) infinite both}
.w1{animation-name:w1}.c1{animation-name:c1}.w2{animation-name:w2}.c2{animation-name:c2}.w3{animation-name:w3}.c3{animation-name:c3}
@keyframes w1{0%,13%{opacity:1}15%,100%{opacity:0}}
@keyframes c1{0%,14%{opacity:0;transform:scale(.9)}17%,94%{opacity:1;transform:none}98%,100%{opacity:0}}
@keyframes w2{0%,20%{opacity:1}22%,100%{opacity:0}}
@keyframes c2{0%,21%{opacity:0;transform:scale(.9)}24%,94%{opacity:1;transform:none}98%,100%{opacity:0}}
@keyframes w3{0%,28%{opacity:1}30%,100%{opacity:0}}
@keyframes c3{0%,29%{opacity:0;transform:scale(.9)}32%,94%{opacity:1;transform:none}98%,100%{opacity:0}}
.done{animation:done 9s var(--ease-out) infinite both}
@keyframes done{0%,16%{opacity:.4}19%,94%{opacity:1}98%,100%{opacity:.4}}
.drift{animation:drift 6s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translateY(0)}100%{transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){.ob *{animation:none !important}}
</style>
</helmet>
<div class="ob t-light" style="width: 880px; height: 844px; display: flex; gap: 80px; background: var(--bg); color: var(--text-1); font-family: var(--font-sans);">

  <!-- Sign in -->
  <div class="panel">
    <main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 32px; text-align: center;">
      <svg class="drift" width="48" height="48" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 5.5h12L5 11h12L7 16.5h13" fill="none" style="stroke: var(--accent-ink);" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 8px; align-items: center;">
        <h1 style="margin: 0; font-size: 21px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em;">Agentic Routines</h1>
        <p style="margin: 0; font-size: 13px; line-height: 20px; color: var(--text-2); max-width: 260px;">Sign in once. Your routines follow you to every browser you use.</p>
      </div>
      <button class="gbtn" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path></svg>
        Continue with Google
      </button>
    </main>
    <footer style="flex-shrink: 0; padding: 16px; display: flex; justify-content: center; gap: 6px; font-size: 12px; color: var(--text-3);">
      <span>Passwords you type are never saved.</span>
      <a href="#" style="color: var(--text-2);">Privacy</a>
    </footer>
  </div>

  <!-- Connect an agent -->
  <div class="panel">
    <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 16px; border-bottom: 1px solid var(--border);">
      <div style="display: flex; align-items: center; gap: 10px;">
        <svg width="20" height="20" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 5.5h12L5 11h12L7 16.5h13" fill="none" style="stroke: var(--accent-ink);" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <h1 style="margin: 0; font-size: 15px; font-weight: 500;">Routines</h1>
      </div>
      <button class="icon-btn" type="button" aria-label="Account, arun.prakash"><span style="width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center;">A</span></button>
    </header>

    <main style="flex: 1; padding: 28px 16px; display: flex; flex-direction: column; gap: 20px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <h2 style="margin: 0; font-size: 17px; font-weight: 500;">Connect your agent</h2>
        <p style="margin: 0; font-size: 13px; line-height: 20px; color: var(--text-2);">Run this once in a terminal. It sets up every agent it finds.</p>
      </div>
      <div style="height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 2px 0 14px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface-1); font-family: var(--font-mono); font-size: 13px;">
        <span><span style="color: var(--text-3);">$ </span>npx agentic-routines setup</span>
        <button class="icon-btn" type="button" aria-label="Copy command"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"></rect><path d="M10.5 5V3.5A1.5 1.5 0 009 2H3.5A1.5 1.5 0 002 3.5V9a1.5 1.5 0 001.5 1.5H5"></path></svg></button>
      </div>

      <div role="list" aria-label="Agents" style="border: 1px solid var(--border); border-radius: 12px; background: var(--surface-1);">
        <sc-for list="{{agents}}" as="a" hint-placeholder-count="4">
          <div class="agent" role="listitem">
            <span>{{a.name}}</span>
            <span class="st">
              <sc-if value="{{a.found}}" hint-placeholder-val="{{true}}">
                <span class="w {{a.w}}" style="color: var(--text-3);"><span class="pips scan"><i></i><i></i><i></i></span>Waiting</span>
                <span class="c {{a.c}}" style="color: var(--accent-ink);"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 8.5l3 3 7-7"></path></svg>Connected</span>
              </sc-if>
              <sc-if value="{{a.missing}}" hint-placeholder-val="{{false}}">
                <span style="color: var(--text-3);">Not installed</span>
              </sc-if>
            </span>
          </div>
        </sc-for>
      </div>
    </main>

    <footer style="flex-shrink: 0; padding: 12px 16px 16px; border-top: 1px solid var(--border);">
      <button class="btn btn-primary done" type="button" style="width: 100%;">Done</button>
    </footer>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      agents: [
        { name: 'Claude Code', found: true, missing: false, w: 'w1', c: 'c1' },
        { name: 'Codex', found: true, missing: false, w: 'w2', c: 'c2' },
        { name: 'GitHub Copilot', found: true, missing: false, w: 'w3', c: 'c3' },
        { name: 'OpenCode', found: false, missing: true, w: '', c: '' }
      ]
    };
  }
}
</script>
</body>
</html>
