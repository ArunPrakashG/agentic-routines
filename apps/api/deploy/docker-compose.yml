# The Agentic Routines API and site, as docker-compose.yml in the deploy folder on the server.
# Kept in the repo (apps/api/deploy/) and copied there by deploy.sh; edit it here, not on the server.
#
# The main proxy sends /api/* and /healthz to the API container and everything else to agenticroutines-site (the
# static website, shipped by apps/site/deploy/deploy.sh). Both are reached over the "proxy" network. Postgres and Redis are the
# shared ones, reached over "shared_services".
# .env next to this file (mode 600, never in the repo) holds DATABASE_URL, REDIS_URL, TAG (the image to run), GOOGLE_CLIENT_ID,
# GOOGLE_CLIENT_SECRET, SESSION_SECRET and ADMIN_EMAILS (who may review submissions).

name: agenticroutines

services:
  agenticroutines-api:
    image: agenticroutines-api:${TAG:?set TAG in .env}
    container_name: agenticroutines-api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      TRUSTED_PROXY: caddy
    expose: ["8080"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    # Lets requests in flight finish.
    stop_grace_period: 15s
    networks: [proxy, shared_services]

  # The static site from apps/site, shipped into ./site (conf/Caddyfile and www/current).
  agenticroutines-site:
    image: agenticroutines-site:2.11.4
    container_name: agenticroutines-site
    restart: unless-stopped
    volumes:
      - ./site/conf:/etc/caddy:ro
      - ./site/www:/srv:ro
    tmpfs: ["/config:uid=65534,gid=65534", "/data:uid=65534,gid=65534"]
    expose: ["8080"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 32m
    cpus: 0.25
    # Go's runtime starts a thread per blocked file read, and running out kills the process under a burst.
    pids_limit: 128
    networks: [proxy]

networks:
  proxy:
    external: true
    name: proxy
  shared_services:
    external: true
    name: shared_services
