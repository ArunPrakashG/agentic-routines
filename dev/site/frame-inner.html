<!doctype html>
<title>Inner</title>
<style>
  body { margin: 0; font: 15px system-ui; }
  #pay { position: absolute; left: 10px; top: 10px; width: 160px; height: 40px; }
  #name { position: absolute; left: 10px; top: 70px; }
  label { position: absolute; left: 10px; top: 50px; }
</style>
<button id="pay"></button>
<label for="name"></label>
<input id="name">
<p style="position:absolute;left:10px;top:100px" id="words"></p>
<script>
  const who = new URLSearchParams(location.search).get('who');
  const big = who[0].toUpperCase() + who.slice(1);
  document.getElementById('pay').textContent = `Open ${big}`;
  document.querySelector('label').textContent = `Name ${big}`;
  document.getElementById('words').textContent = `Words ${big}`;
  const tell = (what) => parent.postMessage({ who, what }, '*');
  document.getElementById('pay').addEventListener('click', (e) => tell(`pay ${e.isTrusted}`));
  document.getElementById('name').addEventListener('input', (e) => tell(`typed ${e.target.value}`));
</script>
