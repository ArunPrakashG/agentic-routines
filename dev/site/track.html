<!doctype html><meta charset="utf-8"><title>Track · Acme Console</title>
<style>body{font:14px system-ui;margin:24px;max-width:520px}label{display:block;margin:12px 0}input{display:block;width:100%}
#dlg{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center}#dlg.on{display:flex}#dlg div{background:#fff;padding:24px;border-radius:8px;min-width:280px}</style>
<h1>Internal testing track</h1>
<label>Release name <input id="rname" name="release_name"></label>
<label>What's new <input id="wn" name="whats_new"></label>
<button id="pub" type="button">Publish to track</button>
<div id="dlg"><div role="dialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt">Release published</h2><p>What would you like to do next?</p>
<button id="ov" type="button">Go to overview</button> <button id="else" type="button">Do something else</button></div></div>
<script>
const dlg = document.getElementById('dlg');
document.getElementById('pub').onclick = () => { localStorage.published = document.getElementById('rname').value; dlg.classList.add('on'); };
document.getElementById('else').onclick = () => dlg.classList.remove('on');
// The overview address carries a session id that is new every time.
document.getElementById('ov').onclick = () => { location.href = '/overview.html?sid=' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2) + '9a'; };
</script>
